@if (isLoading()) {
<section class="page-state" aria-live="polite">
    <app-client-profile-skeleton />
</section>
} @else if (errorMessage()) {
<section class="page-state page-state--error" role="alert">
    <h2>Unable to load client profile</h2>
    <p>{{ errorMessage() }}</p>

    <button type="button" (click)="retry()">
        Retry
    </button>
</section>
} @else if (client(); as clientProfile) {

<app-client-header [client]="clientProfile" />

<div class="client-profile-layout">

    <!-- Left column -->
    <aside class="client-profile-layout__left">

        <app-archetype-card [archetype]="clientProfile.archetype" />

        <app-personal-details [personal]="clientProfile.personal" />

        <app-assigned-team [team]="clientProfile.assignedTeam" />

        <app-household [members]="clientProfile.household" />
    </aside>

    <!-- Main column -->
    <main class="client-profile-layout__main">
        <app-lifecycle-stepper [lifecycle]="clientProfile.lifecycle" />

        <app-financial-snapshot [snapshot]="clientProfile.financialSnapshot" />

        <app-compliance [compliance]="clientProfile.compliance" />

        <app-activity-feed [activities]="clientProfile.activity" />
    </main>

    <!-- Right column -->
    <aside class="client-profile-layout__right">
        <!-- Next Action, Workbook -->
        <!-- will be added here -->
    </aside>

</div>
}
