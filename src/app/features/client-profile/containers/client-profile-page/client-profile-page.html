@if (isLoading()) {
<section class="state-panel" aria-live="polite">
    <p>Loading client profile...</p>
</section>
} @else if (errorMessage()) {
<section class="state-panel state-panel--error" role="alert">
    <h2>Unable to load client profile</h2>
    <p>{{ errorMessage() }}</p>

    <button type="button" (click)="retry()">
        Retry
    </button>
</section>
} @else if (client(); as clientProfile) {
<app-client-header [client]="clientProfile" />
}
